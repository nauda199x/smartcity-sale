name: Import Media

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: Public Google Drive folder ID
        required: true
        type: string
      slug:
        description: Lowercase project/media slug
        required: true
        type: string
      type:
        description: Media pack type
        required: true
        default: project
        type: choice
        options: [project, amenity, editorial, listing, shared]
      branch_name:
        description: Optional new branch name (media-import/<slug>-<run> by default)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-media-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-media.txt
      - name: Install media dependencies
        run: python3 -m pip install -r requirements-media.txt
      - name: Validate inputs and choose branch
        id: branch
        env:
          REQUESTED: ${{ inputs.branch_name }}
          SLUG: ${{ inputs.slug }}
        run: |
          python3 -c 'import sys; from tools.media_utils import validate_slug; validate_slug(sys.argv[1])' "$SLUG"
          branch="${REQUESTED:-media-import/${SLUG}-${GITHUB_RUN_ID}}"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$branch" != -* ]] && [[ "$branch" != *..* ]]
          git check-ref-format --branch "$branch"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Download and process public Drive media
        env:
          FOLDER_ID: ${{ inputs.folder_id }}
          SLUG: ${{ inputs.slug }}
          MEDIA_TYPE: ${{ inputs.type }}
        run: |
          python3 tools/import_drive_media.py \
            --folder-id "$FOLDER_ID" \
            --slug "$SLUG" \
            --type "$MEDIA_TYPE" \
            --force
      - name: Validate media and build site
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          python3 tools/validate_media.py --slug "$SLUG"
          python3 tools/build_site.py
          python3 tools/validate_site.py
          python3 tools/validate_project_profiles.py
      - name: Validate deployment artifact
        run: |
          rm -rf _site
          python3 tools/prepare_deploy.py
          python3 tools/validate_site.py --root _site
          type_dir='${{ inputs.type }}'; case "$type_dir" in project) type_dir=projects;; amenity) type_dir=amenities;; listing) type_dir=listings;; esac
          if find "_site/images/${type_dir}/${{ inputs.slug }}" -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.zip' \) -print -quit 2>/dev/null | grep -q .; then
            echo 'Unexpected source/archive file in _site' >&2
            exit 1
          fi
      - name: Commit generated production files
        env:
          SLUG: ${{ inputs.slug }}
          TYPE: ${{ inputs.type }}
        run: |
          rm -rf _site .media-tmp media-source
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          type_dir="$TYPE"; case "$TYPE" in project) type_dir=projects;; amenity) type_dir=amenities;; listing) type_dir=listings;; esac
          git add "images/${type_dir}/${SLUG}" "data/media/${SLUG}.json" -- '*.html'
          if git diff --cached --name-only | grep -Ei '\.(jpe?g|png|zip)$|(^|/)(\.media-tmp|media-source|_site)/'; then
            echo 'Original or temporary media was staged' >&2
            exit 1
          fi
          git diff --cached --quiet && { echo 'Import produced no changes' >&2; exit 1; }
          git commit -m "Import ${SLUG} media from Google Drive"
          git push --set-upstream origin '${{ steps.branch.outputs.name }}'
      - name: Create pull request
        id: pull_request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base '${{ github.event.repository.default_branch }}' \
            --head '${{ steps.branch.outputs.name }}' \
            --title "Import ${{ inputs.slug }} media" \
            --body "Generated by the manual Import Media workflow from public Google Drive folder \`${{ inputs.folder_id }}\`. Includes optimized WebP variants, manifest, and rebuilt pages."
      - name: Report import branch
        if: always() && steps.branch.outputs.name != ''
        run: |
          echo "Imported branch: \`${{ steps.branch.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ '${{ steps.pull_request.outcome }}' != success ]]; then
            echo 'Automatic PR creation was unavailable; open a PR from the branch above.' >> "$GITHUB_STEP_SUMMARY"
          fi
