name: Build flat public routes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stable public routes
        run: python3 tools/build_flat_public_routes.py
      - name: Commit generated routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml *.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: publish stable flat routes and SEO aliases"
          git push
