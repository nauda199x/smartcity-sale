name: Bootstrap Canopy internal assets

on:
  push:
    branches:
      - content/canopy-depth-20260901

permissions:
  contents: write

jobs:
  canopy-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build local WebP asset pack
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          import hashlib, io, json
          from pathlib import Path
          import requests
          from PIL import Image

          OUT = Path("images/official/canopy")
          OUT.mkdir(parents=True, exist_ok=True)
          DATA = Path("data/official")
          DATA.mkdir(parents=True, exist_ok=True)

          assets = [
            {
              "filename":"canopy-3-toa-thuc-te-2025.webp",
              "source_url":"https://file4.batdongsan.com.vn/2025/08/01/20250801151237-1949_wm.jpg",
              "source_page":"https://batdongsan.com.vn/du-an-can-ho-chung-cu-nam-tu-liem/the-canopy-residences-vinhomes-smart-city-pj5912",
              "media_type":"actual",
              "published_context":"completed tower exterior, published 2025-08"
            },
            {
              "filename":"canopy-sanh-thuc-te-2025.webp",
              "source_url":"https://file4.batdongsan.com.vn/2025/08/01/20250801151208-c978_wm.jpg",
              "source_page":"https://batdongsan.com.vn/du-an-can-ho-chung-cu-nam-tu-liem/the-canopy-residences-vinhomes-smart-city-pj5912",
              "media_type":"actual",
              "published_context":"completed lobby/reception, published 2025-08"
            },
            {
              "filename":"canopy-canh-quan-thuc-te-2025.webp",
              "source_url":"https://file4.batdongsan.com.vn/2025/08/01/20250801151219-66c9_wm.jpg",
              "source_page":"https://batdongsan.com.vn/du-an-can-ho-chung-cu-nam-tu-liem/the-canopy-residences-vinhomes-smart-city-pj5912",
              "media_type":"actual",
              "published_context":"completed podium and landscape, published 2025-08"
            },
            {
              "filename":"canopy-be-boi-tre-em-thuc-te.webp",
              "source_url":"https://file4.batdongsan.com.vn/2025/08/01/20250801151329-f661_wm.jpg",
              "source_page":"https://batdongsan.com.vn/nha-dat-ban-the-canopy-residences-vinhomes-smart-city",
              "media_type":"actual",
              "published_context":"operational children's pool, published 2025-08"
            },
            {
              "filename":"canopy-be-boi-thuc-te.webp",
              "source_url":"https://images.trvl-media.com/lodging/124000000/123360000/123354200/123354106/b9e8ef30.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575",
              "source_page":"https://www.expedia.com/Hanoi-Hotels-Luxhomes-TC1-Canopy-Vinhomes-Smart-City.h123354106.Hotel-Information",
              "media_type":"actual",
              "published_context":"operational pool at TC1 Canopy, retrieved 2026-09-01"
            },
            {
              "filename":"canopy-tong-mat-bang.webp",
              "source_url":"https://file.canho.com.vn/canopy_2ce8f7b016.jpg",
              "source_page":"https://canho.com.vn/vinhomes-smart-city/the-canopy-residences",
              "media_type":"diagram",
              "published_context":"three-tower site plan TC1 TC2 TC3"
            },
            {
              "filename":"canopy-mat-bang-tc1.webp",
              "source_url":"https://chungcuvinhomessmartcity.com.vn/wp-content/uploads/Mat-bang-toa-TC1-Canopy-1024x815.jpg",
              "source_page":"https://chungcuvinhomessmartcity.com.vn/the-canopy-residences/toa-tc1",
              "media_type":"diagram",
              "published_context":"TC1 typical-floor plan"
            },
            {
              "filename":"canopy-mat-bang-tc2.webp",
              "source_url":"https://vinhomesland.vn/wp-content/uploads/2024/03/mat-bang-toa-tc2-vinhomes-smart-city.jpg",
              "source_page":"https://vinhomesland.vn/toa-tc2-vinhomes-smart-city/",
              "media_type":"diagram",
              "published_context":"TC2 typical-floor plan"
            },
            {
              "filename":"canopy-mat-bang-tc3.webp",
              "source_url":"https://file4.batdongsan.com.vn/resize/1275x717/2025/07/07/20250707161353-e060_wm.jpg",
              "source_page":"https://batdongsan.com.vn/ban-can-ho-chung-cu-duong-dai-lo-thang-long-phuong-tay-mo-prj-the-canopy-residences-vinhomes-smart-city/ban-gap-2pn-1-dt-75m2-tai-chi-nhinh-5-6-ty-bao-phi-canh-nha-xe-o-to-pr43461680",
              "media_type":"diagram",
              "published_context":"TC3/P19 typical-floor plan"
            }
          ]

          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8"})
          manifest=[]
          for item in assets:
            r=s.get(item["source_url"],timeout=45)
            r.raise_for_status()
            im=Image.open(io.BytesIO(r.content)); im.load()
            if im.mode=="RGBA":
              bg=Image.new("RGB",im.size,"white"); bg.paste(im,mask=im.getchannel("A")); im=bg
            elif im.mode!="RGB":
              im=im.convert("RGB")
            dest=OUT/item["filename"]
            im.save(dest,"WEBP",quality=86,method=6)
            b=dest.read_bytes()
            manifest.append({
              "source_url":item["source_url"],
              "source_page":item["source_page"],
              "local_path":"/"+dest.as_posix(),
              "width":im.width,"height":im.height,
              "sha1":hashlib.sha1(b).hexdigest(),
              "bytes":len(b),
              "media_type":item["media_type"],
              "published_context":item["published_context"]
            })
            print(item["filename"],im.size,len(b))
          (DATA/"canopy-assets.json").write_text(json.dumps({"count":len(manifest),"assets":manifest},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if len(manifest)!=9: raise SystemExit("expected 9 assets")
          PY
      - name: Commit generated assets
        run: |
          rm -f .github/workflows/canopy-assets-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/official/canopy data/official/canopy-assets.json .github/workflows/canopy-assets-bootstrap.yml
          git commit -m "Bootstrap internal Canopy image pack [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
