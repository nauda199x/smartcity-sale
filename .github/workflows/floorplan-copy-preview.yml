name: Floorplan copy preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build floorplan copy
        run: |
          python3 tools/build_precinct_masterplans.py
          python3 tools/integrate_precinct_masterplans.py
          python3 tools/build_rich_tower_content.py
          python3 tools/humanize_floorplan_copy.py
      - name: Upload generated floorplan pages
        uses: actions/upload-artifact@v4
        with:
          name: floorplan-copy-preview
          path: mat-bang-smart-city
          retention-days: 1
