name: Download editorial images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-editorial-images.yml'
      - 'tools/enrich_blog_images.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official project images
        run: |
          mkdir -p images/editorial
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://smartcity.vinhomes.vn/wp-content/themes/vinhomes-smart-city/assets/images/homepage/home1/a2.png' -o images/editorial/vinhomes-smart-city-overview.png
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://vinhomes.vn/sites/default/files/styles/images_525_x_295/public/2021-07/Hinh-anh-the-sapphire-vinhomes-smart-city.jpg?itok=T_nLf8w9' -o images/editorial/sapphire-vinhomes-smart-city.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://vinhomes.vn/sites/default/files/styles/images_560_x_315/public/2021-05/PC02.Topdown%20The%20Sakura%20-%20Final.jpg?itok=RBkxJLpO' -o images/editorial/the-sakura-vinhomes-smart-city.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://masterisehomes.com/masteri-west-heights/themes/masterise/assets/images/home/about2_img.jpeg' -o images/editorial/masteri-west-heights.jpg
          file images/editorial/*
      - name: Commit images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/editorial
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: store editorial project images locally'
          git push
