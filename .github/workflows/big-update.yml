name: Big update - validate sale listings

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize sale data and website copy
        run: python3 tools/big_update_2026_08_12.py

      - name: Remove apartment IDs from public JSON
        run: python3 tools/strip_public_ids.py

      - name: Hide apartment ID references in UI
        run: python3 tools/hide_public_id_ui.py

      - name: Validate JSON
        run: python3 -m json.tool data.json >/dev/null

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "No normalization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git commit -m "Big update: clean sale data, website info and public IDs"
          git push
