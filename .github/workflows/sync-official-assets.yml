name: Sync official Smart City assets

on:
  workflow_dispatch:
  push:
    branches:
      - feat/portal-architecture-v1
    paths:
      - 'data/official/asset-seeds.json'
      - 'tools/sync_official_assets.py'
      - '.github/workflows/sync-official-assets.yml'

permissions:
  contents: write

jobs:
  crawl-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portal-architecture-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 pillow

      - name: Crawl, download and optimize first-party media
        run: python tools/sync_official_assets.py

      - name: Validate manifest
        run: python -m json.tool data/official/asset-manifest.json >/dev/null

      - name: Commit local WebP assets and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/official data/official/asset-manifest.json
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'assets: sync official Smart City media locally'
          git push origin HEAD:feat/portal-architecture-v1
