name: Bootstrap Tonkin internal assets

on:
  push:
    branches:
      - content/tonkin-depth-20260901

permissions:
  contents: write

jobs:
  tonkin-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build local WebP asset pack
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          import hashlib, io, json
          from pathlib import Path
          import requests
          from PIL import Image

          OUT=Path("images/official/tonkin"); OUT.mkdir(parents=True,exist_ok=True)
          DATA=Path("data/official"); DATA.mkdir(parents=True,exist_ok=True)
          assets=[
            {"filename":"tonkin-tk1-canh-quan-thuc-te-2023.webp","source_url":"https://cdnphoto.dantri.com.vn/PoR1aZxt8pWBhpNl3Zn651aDkNM%3D/thumb_w/1020/2023/01/05/anh-1-1672896932303.jpeg","source_page":"https://dantri.com.vn/bat-dong-san/cu-dan-tk1-vinhomes-smart-city-hao-huc-nhan-nha-don-tet-quy-mao-20230105123931135.htm","media_type":"actual","published_context":"TK1 completed exterior, pool and landscape, January 2023"},
            {"filename":"tonkin-sanh-lounge-thuc-te-2023.webp","source_url":"https://cdnphoto.dantri.com.vn/WKtecWUQwiRkIRHm8Jz603V2Tqw%3D/thumb_w/1020/2023/01/05/anh-2-1672896932299.jpeg","source_page":"https://dantri.com.vn/bat-dong-san/cu-dan-tk1-vinhomes-smart-city-hao-huc-nhan-nha-don-tet-quy-mao-20230105123931135.htm","media_type":"actual","published_context":"real Tonkin lobby/lounge, January 2023"},
            {"filename":"tonkin-ho-boi-thuc-te-2023.webp","source_url":"https://cdnphoto.dantri.com.vn/5RRTQ4uLbmAPOisqIHFMaYiRpy0%3D/thumb_w/1020/2023/01/05/anh-5-1672896932296.jpeg","source_page":"https://dantri.com.vn/bat-dong-san/cu-dan-tk1-vinhomes-smart-city-hao-huc-nhan-nha-don-tet-quy-mao-20230105123931135.htm","media_type":"actual","published_context":"operational Tonkin pool and sports landscape, January 2023"},
            {"filename":"tonkin-the-goddess-ban-dem.webp","source_url":"https://cdn-merchant.vinid.net/images/gallery/omre_trang_tin_tuc/image_upload_1734451357_1.png","source_page":"https://onehousing.vn/blog/ban-can-ho-the-tonkin-vinhomes-smart-city-toa-tk2-chi-tiet-nhat-n17t","media_type":"actual","published_context":"The Goddess clock and Tonkin entrance at night"},
            {"filename":"tonkin-tk1-cong-thuc-te.webp","source_url":"https://cdn-merchant.vinid.net/images/image_upload_1681747906_223.png","source_page":"https://onehousing.vn/blog/can-1pn-toa-tk1-the-tonkin-vinhomes-smart-city-412m-co-gia-bao-nhieu-n17t","media_type":"actual","published_context":"TK1 completed entrance and ground-floor exterior"},
            {"filename":"tonkin-tong-mat-bang.webp","source_url":"https://storage.googleapis.com/vinhomes-data-02/tong-quan-quy-hoach-mat-bang-the-tonkin_1646985939_1646985939.jpg","source_page":"https://vinhomes.vn/vi/mat-bang-the-tonkin-duoc-quy-hoach-dac-biet-nhu-the-nao","media_type":"diagram","published_context":"official The Tonkin site/amenity plan"},
            {"filename":"tonkin-mat-bang-tk1.webp","source_url":"https://storage.googleapis.com/vinhomes-data-02/mat-bang-the-tokin-mat-bang-tang-dien-hinh-toa-tk1_1646986075_1646986075.jpg","source_page":"https://vinhomes.vn/vi/mat-bang-the-tonkin-duoc-quy-hoach-dac-biet-nhu-the-nao","media_type":"diagram","published_context":"official TK1 typical-floor plan"},
            {"filename":"tonkin-mat-bang-tk2.webp","source_url":"https://smartcity.vinhomes.vn/the-tonkin/tk2/wp-content/uploads/2022/06/MBT31-38-min.png","source_page":"https://smartcity.vinhomes.vn/the-tonkin/tk2/","media_type":"diagram","published_context":"official TK2 floor 31-38 plan"}
          ]
          s=requests.Session(); s.headers.update({"User-Agent":"Mozilla/5.0","Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8"})
          manifest=[]
          for item in assets:
            r=s.get(item["source_url"],timeout=45); r.raise_for_status()
            im=Image.open(io.BytesIO(r.content)); im.load()
            if im.mode=="RGBA":
              bg=Image.new("RGB",im.size,"white"); bg.paste(im,mask=im.getchannel("A")); im=bg
            elif im.mode!="RGB": im=im.convert("RGB")
            dest=OUT/item["filename"]; im.save(dest,"WEBP",quality=86,method=6)
            b=dest.read_bytes()
            manifest.append({**item,"local_path":"/"+dest.as_posix(),"width":im.width,"height":im.height,"sha1":hashlib.sha1(b).hexdigest(),"bytes":len(b)})
            print(item["filename"],im.size,len(b))
          (DATA/"tonkin-assets.json").write_text(json.dumps({"count":len(manifest),"assets":manifest},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if len(manifest)!=8: raise SystemExit("expected 8 assets")
          PY
      - name: Commit generated assets
        run: |
          rm -f .github/workflows/tonkin-assets-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/official/tonkin data/official/tonkin-assets.json .github/workflows/tonkin-assets-bootstrap.yml
          git commit -m "Bootstrap internal Tonkin image pack [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
