name: Build, validate and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-media.txt
      - name: Install media pipeline dependencies
        run: python3 -m pip install -r requirements-media.txt
      - name: Compile build and media pipelines
        run: python3 -m py_compile tools/import_drive_media.py tools/process_media_pack.py tools/media_utils.py tools/validate_media.py tools/public_images.py tools/build_project_profiles.py tools/validate_project_profiles.py
      - name: Test media pipeline integration
        run: python3 -m unittest tests.test_media_pipeline tests.test_public_images -v
      - name: Validate media manifests
        run: python3 tools/validate_media.py
      - name: Build generated pages
        run: python3 tools/build_site.py
      - name: Verify generated files are committed
        run: git diff --exit-code
      - name: Validate production site
        run: python3 tools/validate_site.py
      - name: Stage public artifact
        run: python3 tools/prepare_deploy.py
      - name: Validate staged artifact
        run: python3 tools/validate_site.py --root _site
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
