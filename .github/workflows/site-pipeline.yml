name: Validate and deploy Smart City portal

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Match Lumi's refresh cadence. Unchanged inventory skips publishing.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smartcity-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_needed: ${{ steps.changes.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dossier validation dependencies
        run: python3 -m pip install --quiet beautifulsoup4 pillow
      - name: Validate marketplace paging and administration
        run: |
          node --test tools/qa_admin_api.cjs tools/qa_admin_ui.cjs tools/qa_inventory_api.cjs
          node --check assets/js/marketplace-saved-searches.js
          node --check assets/js/marketplace-saved-searches-ui.js
          node --check assets/js/marketplace-saved-searches-account.js
          python3 tools/qa_marketplace_pages.py
          python3 tools/qa_marketplace_accounts.py
          python3 tools/qa_saved_searches_landings.py
      - name: Validate deep marketplace SEO
        run: python3 tools/qa_deep_marketplace_seo.py
      - name: Validate topical authority SEO
        run: python3 tools/qa_topical_authority.py
      - name: Validate high-intent traffic SEO source
        run: python3 tools/qa_traffic_seo_cluster.py
      - name: Validate deep floorplan SEO cluster
        run: python3 tools/qa_floorplan_seo_cluster.py
      - name: Validate Masteri floorplan SEO cluster
        run: python3 tools/qa_masteri_seo_cluster.py
      - name: Validate Lumiere Evergreen floorplan SEO cluster
        run: python3 tools/qa_lumiere_seo_cluster.py
      - name: Validate The Victoria dossier
        run: python3 tools/validate_victoria_assets.py
      - name: Validate The Sakura dossier
        run: python3 tools/validate_sakura_assets.py
      - name: Validate The Miami dossier
        run: python3 tools/validate_miami_assets.py
      - name: Validate The Canopy dossier
        run: python3 tools/validate_canopy_assets.py
      - name: Validate The Tonkin dossier
        run: python3 tools/validate_tonkin_assets.py
      - name: Validate The Sola Park progress
        run: python3 tools/validate_sola_progress.py
      - name: Validate master floor-plan hub
        run: python3 tools/validate_floorplan_hub.py
      - name: Validate real estate UI system
        run: python3 tools/validate_real_estate_ui.py
      - name: Build deep precinct masterplans
        run: python3 tools/build_precinct_masterplans.py
      - name: Integrate masterplans into main floorplan pages
        run: python3 tools/integrate_precinct_masterplans.py
      - name: Build rich editorial tower content
        run: python3 tools/build_rich_tower_content.py
      - name: Validate combined precinct floorplan structure
        run: python3 tools/qa_precinct_masterplan_integration.py
      - name: Validate source portal
        run: python3 tools/validate_portal_v2.py
      - name: Stage clean public site
        run: python3 tools/prepare_portal_v2.py
      - name: Build high-intent traffic SEO cluster
        run: python3 tools/build_traffic_seo_cluster.py
      - name: Validate staged traffic SEO cluster
        run: python3 tools/qa_traffic_seo_cluster.py
      - name: Build inventory-backed SEO landing pages
        run: python3 tools/build_marketplace_landings.py
      - name: Build production SEO surfaces
        run: python3 tools/build_seo_portal.py
      - name: Deepen marketplace crawl, freshness and schema
        run: python3 tools/deepen_marketplace_seo.py
      - name: Build topical authority SEO cluster
        run: python3 tools/build_topical_authority.py
      - name: Remove noindex URLs from generated sitemaps
        run: python3 tools/sanitize_sitemaps.py
      - name: Validate SEO canonicals and sitemaps
        run: python3 tools/validate_seo_portal.py
      - name: Validate staged portal
        run: python3 tools/validate_portal_v2.py --root _site
      - name: Check whether scheduled inventory has changed
        id: changes
        run: python3 tools/check_marketplace_change.py
      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: smartcity-portal-preview
          path: _site
          retention-days: 1
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changes.outputs.needed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changes.outputs.needed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.deploy_needed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
