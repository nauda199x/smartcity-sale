name: Bootstrap Sakura internal assets

on:
  push:
    branches:
      - content/sakura-depth-20260901

permissions:
  contents: write

jobs:
  sakura-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build local WebP asset pack
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          import hashlib, io, json
          from pathlib import Path
          import requests
          from PIL import Image

          OUT = Path("images/official/sakura")
          OUT.mkdir(parents=True, exist_ok=True)
          DATA = Path("data/official")
          DATA.mkdir(parents=True, exist_ok=True)

          assets = [
            {
              "filename":"sakura-sa1-thuc-te.webp",
              "source_url":"https://images.trvl-media.com/lodging/124000000/123140000/123132700/123132604/9bf660f1.jpg?impolicy=resizecrop&ra=fit&rw=1600",
              "source_page":"https://www.wotif.co.nz/Hanoi-Hotels-Luxhomes-SA1-Toji-Sakura-Vinhome-Smart-City.h123132604.Hotel-Information",
              "media_type":"actual",
              "published_context":"operational SA1 exterior and Sakura sculpture, retrieved 2026-09-01"
            },
            {
              "filename":"sakura-ho-boi-thuc-te.webp",
              "source_url":"https://images.trvl-media.com/lodging/124000000/123140000/123132700/123132604/8037e041.jpg?impolicy=resizecrop&ra=fit&rw=1600",
              "source_page":"https://www.wotif.co.nz/Hanoi-Hotels-Luxhomes-SA1-Toji-Sakura-Vinhome-Smart-City.h123132604.Hotel-Information",
              "media_type":"actual",
              "published_context":"operational resident swimming-pool image, retrieved 2026-09-01"
            },
            {
              "filename":"sakura-sa1-thang-5-2025.webp",
              "source_url":"https://chungcudep.net/wp-content/uploads/2023/10/anh-thuc-te-tien-do-toa-sa1-the-sakura-vinhomes-smart-city-thang-5-2025.jpg",
              "source_page":"https://chungcudep.net/toa-sa1-the-sakura-vinhomes-smart-city.html",
              "media_type":"actual",
              "published_context":"SA1 exterior progress labelled May 2025"
            },
            {
              "filename":"sakura-sa5-tien-do-2023.webp",
              "source_url":"https://chungcuvinhomessmartcity.com.vn/wp-content/uploads/Tien-do-SA5-thang-7.jpg",
              "source_page":"https://chungcuvinhomessmartcity.com.vn/the-sakura/toa-sa5/",
              "media_type":"actual",
              "published_context":"SA5 construction progress labelled July 2023"
            },

            {
              "filename":"sakura-mat-bang-sa1.webp",
              "source_url":"https://chungcudep.net/wp-content/uploads/2023/11/mat-bang-toa-sa1-the-sakura-vinhomes-smart-city.jpg",
              "source_page":"https://chungcudep.net/mat-bang-toa-sa1-the-sakura.html",
              "media_type":"diagram",
              "published_context":"SA1 typical-floor plan"
            },
            {
              "filename":"sakura-mat-bang-sa2.webp",
              "source_url":"https://vinhomesland.vn/wp-content/uploads/2022/10/mat-bang-toa-sa2-vinhomes-smart-city.jpg",
              "source_page":"https://vinhomesland.vn/toa-sa2-vinhomes-smart-city/",
              "media_type":"diagram",
              "published_context":"SA2 typical-floor plan"
            },
            {
              "filename":"sakura-mat-bang-sa3.webp",
              "source_url":"https://thanhdatland.com/wp-content/uploads/2023/06/mat-bang-tang-dien-hinh-SA3.webp",
              "source_page":"https://thanhdatland.com/?da_image=mat-bang-toa-sa3-vinhomes-smart-city",
              "media_type":"diagram",
              "published_context":"SA3 typical-floor plan"
            },
            {
              "filename":"sakura-mat-bang-sa5.webp",
              "source_url":"https://vinhomesland.vn/wp-content/uploads/2023/09/mat-bang-toa-sa5-vinhomes-smart-city.jpg",
              "source_page":"https://vinhomesland.vn/toa-sa5-vinhomes-smart-city/",
              "media_type":"diagram",
              "published_context":"SA5 typical-floor plan"
            }
          ]

          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8"})
          manifest=[]
          for item in assets:
            r=s.get(item["source_url"],timeout=40)
            r.raise_for_status()
            im=Image.open(io.BytesIO(r.content)); im.load()
            if im.mode=="RGBA":
              bg=Image.new("RGB",im.size,"white"); bg.paste(im,mask=im.getchannel("A")); im=bg
            elif im.mode!="RGB":
              im=im.convert("RGB")
            dest=OUT/item["filename"]
            im.save(dest,"WEBP",quality=86,method=6)
            b=dest.read_bytes()
            manifest.append({
              "source_url":item["source_url"],
              "source_page":item["source_page"],
              "local_path":"/"+dest.as_posix(),
              "width":im.width,"height":im.height,
              "sha1":hashlib.sha1(b).hexdigest(),
              "bytes":len(b),
              "media_type":item["media_type"],
              "published_context":item["published_context"]
            })
            print(item["filename"],im.size,len(b))
          (DATA/"sakura-assets.json").write_text(json.dumps({"count":len(manifest),"assets":manifest},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if len(manifest)!=8: raise SystemExit("expected 8 assets")
          PY
      - name: Commit generated assets
        run: |
          rm -f .github/workflows/sakura-assets-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/official/sakura data/official/sakura-assets.json .github/workflows/sakura-assets-bootstrap.yml
          git commit -m "Bootstrap internal Sakura image pack [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
