<style>
  :root{
    --navy:#8E1620; --navy-2:#C8202B; --ink:#16202B;
    --gray:#5B6875; --bg:#F4F6F9; --line:#E3E8EE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Be Vietnam Pro",system-ui,sans-serif;
    min-height:100vh; display:grid; place-items:center; padding:24px;
    line-height:1.6;
  }
  .hop{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:40px 32px; max-width:520px; width:100%; text-align:center;
  }
  .so{
    font-family:"Plus Jakarta Sans",sans-serif; font-weight:800;
    font-size:64px; line-height:1; color:var(--navy-2); letter-spacing:-.03em;
  }
  h1{
    font-family:"Plus Jakarta Sans",sans-serif; font-weight:700;
    font-size:22px; margin:14px 0 10px; letter-spacing:-.02em;
  }
  p{color:var(--gray); font-size:15px; margin-bottom:8px}
  .nut{
    display:inline-block; margin-top:22px; text-decoration:none;
    background:var(--navy-2); color:#fff; font-weight:600; font-size:15px;
    padding:13px 28px; border-radius:10px; transition:background .15s;
  }
  .nut:hover{background:var(--navy)}
  .phu{
    margin-top:20px; padding-top:18px; border-top:1px solid var(--line);
    font-size:13.5px; color:var(--gray);
  }
  .phu a{color:var(--navy-2); font-weight:500}
</style>
